spring:
  application:
    name: velora-api
  autoconfigure:
    # Sin usuario en memoria con contraseña generada: la autenticación es propia (ADR-010).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${VELORA_DB_URL:jdbc:postgresql://localhost:5432/velora}
    username: ${VELORA_DB_USERNAME:velora}
    password: ${VELORA_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # El contrato declara additionalProperties: false en los cuerpos de solicitud.
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Un poco más que velora.storage.max-file-size: el almacén aplica el límite exacto (413 en ambos casos).
      max-file-size: 51MB
      max-request-size: 52MB
      file-size-threshold: 1MB
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: es_MX
    locale-resolver: fixed

server:
  port: ${VELORA_API_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

velora:
  defaults:
    time-zone: America/Mexico_City
  storage:
    originals-path: ${VELORA_STORAGE_ORIGINALS_PATH:data/originals}
    max-file-size: 50MB
  import:
    max-attempts: 3
    retry-base-delay: PT30S
    max-points: 200000
    worker:
      enabled: true
      poll-interval: PT2S
      batch-size: 5
      lock-duration: PT5M
  auth:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    throttle:
      free-failures: 5
      window: PT15M
      base-delay: PT30S
      max-delay: PT15M
