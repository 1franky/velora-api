openapi: 3.1.0
info:
  title: Velora API
  version: 1.1.0
  description: API personal de analítica de ciclismo. Contrato inicial; ampliar mediante PRs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado de salud
      security: []
      responses:
        '200':
          description: Servicio disponible
  /auth/login:
    post:
      summary: Iniciar sesión con correo y contraseña
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      summary: Renovar tokens con un refresh token (rotación de un solo uso)
      description: >
        Cada refresh token solo puede usarse una vez. Reutilizar uno ya rotado revoca toda la sesión
        (detección de robo) y responde 401.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Cerrar la sesión asociada a un refresh token
      description: Idempotente. Revoca la sesión completa; un token desconocido o ya revocado también responde 204.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sesión cerrada }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me:
    get:
      summary: Perfil y preferencias del usuario autenticado
      operationId: getMe
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/preferences:
    patch:
      summary: Actualizar preferencias
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bikes:
    get:
      summary: Listar bicicletas
      operationId: listBikes
      responses:
        '200':
          description: Bicicletas del usuario, activas e inactivas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bike' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Registrar una bicicleta
      operationId: createBike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BikeCreate' }
      responses:
        '201':
          description: Bicicleta creada
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bike' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bikes/{bikeId}:
    parameters:
      - in: path
        name: bikeId
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Actualizar una bicicleta
      description: Para retirar una bicicleta sin perder su historial, usar `active=false`.
      operationId: updateBike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BikeUpdate' }
      responses:
        '200':
          description: Bicicleta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bike' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Borrar una bicicleta
      operationId: deleteBike
      responses:
        '204': { description: Bicicleta borrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices:
    get:
      summary: Listar dispositivos de captura
      operationId: listDevices
      responses:
        '200':
          description: Dispositivos del usuario
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Registrar un dispositivo de captura
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Dispositivo creado
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /activities:
    get:
      summary: Listar actividades
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: bikeId
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de actividades
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ActivitySummary' }
                  nextCursor:
                    type: [string, 'null']
  /activities/imports:
    post:
      summary: Importar actividad desde FIT, GPX o TCX
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                bikeId:
                  type: string
                  format: uuid
                deviceId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Importación aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '400': { description: Archivo inválido }
        '413': { description: Archivo demasiado grande }
        '409': { description: Duplicado detectado }
  /imports/{jobId}:
    get:
      summary: Consultar estado de importación
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado del job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
  /dashboard/summary:
    get:
      summary: Resumen del dashboard
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [week, month, year, all] }
      responses:
        '200':
          description: Resumen de métricas
  /geo/heatmap:
    get:
      summary: Obtener heatmap del usuario
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: bbox
          schema: { type: string, description: 'west,south,east,north' }
      responses:
        '200':
          description: Features geoespaciales del viewport
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token opaco de corta duración obtenido en /auth/login o /auth/refresh.
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No autenticado, credenciales inválidas o token expirado/revocado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso inexistente o de otro usuario
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Demasiados intentos; reintentar después de `Retry-After` segundos
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: Problem Details (RFC 9457). Textos en es-MX.
      required: [status, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errorId:
          type: string
          description: Identificador para correlacionar errores 500 con los logs.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    TokenResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresIn]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, minimum: 1, description: Segundos }
        refreshToken: { type: string }
        refreshTokenExpiresIn: { type: integer, minimum: 1, description: Segundos }
    Me:
      type: object
      required: [id, email, preferences]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        preferences: { $ref: '#/components/schemas/Preferences' }
    Preferences:
      type: object
      required: [locale, timeZone, distanceUnit, elevationUnit]
      properties:
        locale:
          type: string
          enum: [es-MX]
        timeZone:
          type: string
          description: Identificador IANA, p. ej. America/Mexico_City.
        distanceUnit:
          type: string
          enum: [km]
        elevationUnit:
          type: string
          enum: [m]
    PreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo se modifican los campos enviados.
      properties:
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        distanceUnit: { type: string, enum: [km] }
        elevationUnit: { type: string, enum: [m] }
    BikeType:
      type: string
      enum: [MTB, ROAD, GRAVEL, OTHER]
    Bike:
      type: object
      required: [id, name, bikeType, brand, model, weightKg, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bikeType: { $ref: '#/components/schemas/BikeType' }
        brand: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        weightKg: { type: [number, 'null'] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    BikeCreate:
      type: object
      additionalProperties: false
      required: [name, bikeType]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        bikeType: { $ref: '#/components/schemas/BikeType' }
        brand: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 50 }
    BikeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Solo se modifican los campos enviados; `null` borra un campo opcional.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        bikeType: { $ref: '#/components/schemas/BikeType' }
        brand: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 50 }
        active: { type: boolean }
    Device:
      type: object
      required: [id, displayName, manufacturer, model, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        manufacturer: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    DeviceCreate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        manufacturer: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100 }
    ActivitySummary:
      type: object
      required: [id, title, startedAt, distanceMeters, movingTimeSeconds]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: string, format: date-time }
        distanceMeters: { type: number }
        movingTimeSeconds: { type: integer }
        elevationGainMeters: { type: [number, 'null'] }
        subType:
          type: string
          enum: [MOUNTAIN_BIKE, ROAD, GRAVEL, INDOOR, OTHER]
    ImportAccepted:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED] }
        statusUrl: { type: string }
    ImportJob:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, DUPLICATE, REJECTED, FAILED]
        activityId: { type: [string, 'null'], format: uuid }
        errorCode: { type: [string, 'null'] }
