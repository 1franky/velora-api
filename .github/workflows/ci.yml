name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, formato y pruebas
        run: ./gradlew build --no-daemon

  respaldos:
    # Respaldo y restauración de punta a punta (ADR-027), con la imagen de PostGIS del despliegue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: restic 0.19.1 (binario oficial, verificado)
        run: |
          curl -fsSLo restic.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2 && chmod +x restic && sudo mv restic /usr/local/bin/restic
          restic version
      - name: Respaldar, restaurar y comparar
        run: ops/respaldos/probar.sh

  imagen:
    # Vulnerabilidades de la imagen que se despliega (10-security-and-operations.md §2). Bloquea solo las CRÍTICAS que
    # ya tienen parche: esas se corrigen subiendo la base o la dependencia. Las ALTAS quedan en el informe del job.
    # La acción se fija por commit, no por etiqueta: una etiqueta se puede mover (ataque a la cadena de suministro).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de la API
        run: docker build -t velora-api:ci .
      - name: Escanear (informe completo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: velora-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Bloquear vulnerabilidades críticas con parche
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: velora-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
